<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account | MTANI TECH</title><link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span>MTANI TECH</span></a><nav><a href="index.html">Back to store</a></nav></header>
  <main class="narrow-page"><p class="eyebrow">CUSTOMER ACCOUNT</p><h1>Log in or create an account</h1><p>Sign in to place and track your order requests.</p>
    <div class="auth-tabs"><button id="loginTab" class="button button-small">Log in</button><button id="signupTab" class="button button-small button-muted">Sign up</button></div>
    <form id="authForm" class="form-card">
      <label id="nameLabel" hidden for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" placeholder="Full name" hidden>
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      <button id="submitButton" class="button" type="submit">Log in</button><p id="authMessage" class="notice" role="status"></p>
    </form>
    <p class="small-note">Admin access is assigned securely in the Supabase dashboard; it is not controlled by a password in this website.</p>
  </main>
  <footer><p>© 2026 MTANI TECH</p></footer>
</body>
</html>
